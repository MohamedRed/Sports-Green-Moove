name: SportsGreenMoove

options:
  bundleIdPrefix: be.sportgreenmoove
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  SportsGreenMoove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SportsGreenMooveApp
        excludes:
          - Resources/**
      - path: Sources/SportsGreenMooveApp/Resources/Fonts/BebasNeue-Regular.ttf
        buildPhase: resources
      - path: Sources/SportsGreenMooveApp/Resources/Fonts/DMSans-Regular.ttf
        buildPhase: resources
      - path: Sources/SportsGreenMooveApp/Resources/Fonts/DMSans-Medium.ttf
        buildPhase: resources
      - path: Sources/SportsGreenMooveApp/Resources/Fonts/DMSans-Bold.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.sportgreenmoove.app
        PRODUCT_NAME: SportsGreenMoove
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sports Green-mOOVe
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf

schemes:
  SportsGreenMoove:
    build:
      targets:
        SportsGreenMoove: all
    run:
      config: Debug
    archive:
      config: Release
