name: SportsGreenMoove

options:
  bundleIdPrefix: be.sportgreenmoove
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "12.11.0"
  Stripe:
    url: https://github.com/stripe/stripe-ios-spm.git
    from: "25.17.0"
  Radar:
    url: https://github.com/radarlabs/radar-sdk-ios-spm.git
    from: "3.34.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "9.1.0"

targets:
  SportsGreenMoove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SportsGreenMooveApp
        excludes:
          - Resources/**
      - path: Sources/SportsGreenMooveApp/Resources
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Stripe
        product: Stripe
      - package: Stripe
        product: StripePaymentSheet
      - package: Radar
        product: RadarSDK
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: be.sportgreenmoove.app
        PRODUCT_NAME: SportsGreenMoove
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "NO"
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Sports Green-mOOVe
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: Sports Green-mOOVe partage votre position uniquement pendant une course active afin d'afficher le véhicule, l'enfant et l'ETA aux parents.
        NSLocationAlwaysUsageDescription: Sports Green-mOOVe utilise la localisation en arrière-plan uniquement pendant une course active afin de maintenir le suivi de sécurité.
        NSLocationAlwaysAndWhenInUseUsageDescription: Sports Green-mOOVe utilise la localisation en arrière-plan uniquement pendant une course active afin de maintenir le suivi de sécurité.
        SGMRadarPublishableKey: $(SGM_RADAR_PUBLISHABLE_KEY)
        SGMGoogleReversedClientID: $(SGM_GOOGLE_REVERSED_CLIENT_ID)
        SGMStripeConnectReturnURL: $(SGM_STRIPE_CONNECT_RETURN_URL)
        SGMStripeConnectRefreshURL: $(SGM_STRIPE_CONNECT_REFRESH_URL)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(SGM_GOOGLE_REVERSED_CLIENT_ID)
        UIBackgroundModes:
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - BebasNeue-Regular.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf

schemes:
  SportsGreenMoove:
    build:
      targets:
        SportsGreenMoove: all
    run:
      config: Debug
    archive:
      config: Release
