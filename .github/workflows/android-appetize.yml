name: Android Appetize Release Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-appetize.yml"
      - "android/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-upload:
    name: Build Android APK and upload to Appetize
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
      APPETIZE_PUBLIC_KEY: ${{ secrets.APPETIZE_PUBLIC_KEY }}
      FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.FIREBASE_ANDROID_CONFIG_BASE64 }}
      SGM_FACEBOOK_APP_ID: ${{ secrets.SGM_FACEBOOK_APP_ID }}
      SGM_FACEBOOK_CLIENT_TOKEN: ${{ secrets.SGM_FACEBOOK_CLIENT_TOKEN }}
      SGM_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.SGM_GOOGLE_MAPS_ANDROID_API_KEY }}
      SGM_RADAR_PUBLISHABLE_KEY: ${{ secrets.SGM_RADAR_PUBLISHABLE_KEY }}
      SGM_STRIPE_CONNECT_RETURN_URL: ${{ secrets.SGM_STRIPE_CONNECT_RETURN_URL }}
      SGM_STRIPE_CONNECT_REFRESH_URL: ${{ secrets.SGM_STRIPE_CONNECT_REFRESH_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Install Firebase Android config
        if: ${{ env.FIREBASE_ANDROID_CONFIG_BASE64 != '' }}
        run: |
          printf '%s' "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: sports-green-moove-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload to Appetize
        id: appetize
        if: ${{ env.APPETIZE_API_TOKEN != '' }}
        uses: appetizeio/github-action-appetize@v1.0.5
        with:
          apiToken: ${{ env.APPETIZE_API_TOKEN }}
          publicKey: ${{ env.APPETIZE_PUBLIC_KEY }}
          platform: android
          appFile: android/app/build/outputs/apk/debug/app-debug.apk
          fileType: apk
          note: "Sports Green-mOOVe debug APK from ${{ github.sha }}"
          timeout: "120"

      - name: Publish Appetize link
        if: ${{ steps.appetize.outputs.publicKey != '' }}
        run: |
          URL="https://appetize.io/app/${{ steps.appetize.outputs.publicKey }}"
          echo "### Android Appetize release preview" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "APPETIZE_URL=$URL" >> "$GITHUB_ENV"

      - name: Missing Appetize token note
        if: ${{ env.APPETIZE_API_TOKEN == '' }}
        run: |
          echo "### Android APK built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set the APPETIZE_API_TOKEN repository secret to enable automatic upload to Appetize." >> "$GITHUB_STEP_SUMMARY"
