name: Release Evidence Gate

on:
  workflow_dispatch:
    inputs:
      manifest_path:
        description: "Path to the real release evidence manifest"
        required: true
        default: "docs/release/evidence-manifest.json"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-evidence:
    name: Validate public-launch release evidence
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Validate release evidence manifest
        run: npm run validate:release-evidence -- "${{ inputs.manifest_path }}"

