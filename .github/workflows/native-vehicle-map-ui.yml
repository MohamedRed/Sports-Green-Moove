name: Approved Vehicle Map UI

on:
  workflow_call:
    secrets:
      SGM_GOOGLE_MAPS_ANDROID_API_KEY:
        required: true

jobs:
  isolated-vehicle-map-ui:
    name: Isolated vehicle-map display
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: android-actions/setup-android@v4
      - name: Compile isolated app before starting the test device
        env:
          SGM_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.SGM_GOOGLE_MAPS_ANDROID_API_KEY }}
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest :qa-install-guard:assembleDebug -PSGM_USE_FIREBASE_EMULATOR=true -PSGM_LOCAL_REAL_MAPS_UI=true --no-daemon --max-workers=2
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the approved isolated vehicle-marker trial
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SGM_VEHICLE_MAP_UI: approved-sdk-map
          SGM_LOCAL_DISPOSABLE_EMULATOR: "true"
          SGM_PAUSE_TEST_PHONE_STORE: "true"
          SGM_BLOCK_TEST_PHONE_INSTALLS: "true"
          SGM_TEST_PHONE_ADMIN_APPROVED: "true"
          SGM_LOCAL_UI_OUTPUT: ${{ github.workspace }}/android/app/build/outputs/vehicle-map-ui/replay
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          script: bash scripts/run-vehicle-map-android-ui.sh
      - name: Retain original vehicle-map trial evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-approved-vehicle-map-ui
          path: android/app/build/outputs/vehicle-map-ui/**
          if-no-files-found: ignore
