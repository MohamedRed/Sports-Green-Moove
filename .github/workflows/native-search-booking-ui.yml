name: Approved Parent Search And Booking

on:
  workflow_call:
    secrets:
      GOOGLE_MAPS_API_KEY:
        required: true

jobs:
  parent-search-booking:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Refuse reuse of the one-trial approval
        run: test "$GITHUB_RUN_ATTEMPT" = 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: android-actions/setup-android@v4
      - name: Compile isolated app before the disposable phone starts
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest :qa-install-guard:assembleDebug -PSGM_USE_FIREBASE_EMULATOR=true --no-daemon --max-workers=2
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: One approved search and two-seat booking chain
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SGM_REAL_MAPS_SERVER_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          SGM_SEARCH_BOOKING_APPROVAL: one-trial-max-eight-requests
          SGM_LOCAL_DISPOSABLE_EMULATOR: "true"
          SGM_PAUSE_TEST_PHONE_STORE: "true"
          SGM_BLOCK_TEST_PHONE_INSTALLS: "true"
          SGM_TEST_PHONE_ADMIN_APPROVED: "true"
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          script: bash scripts/run-search-booking-android-ui.sh
      - name: Retain original results and independent restoration after any outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-parent-search-booking
          path: |
            android/app/build/outputs/parent-search-booking-device/**
            android/app/build/outputs/parent-search-booking-evidence/**
          if-no-files-found: ignore
