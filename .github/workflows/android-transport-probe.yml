name: Android Transport Diagnostic

on:
  workflow_dispatch:
    inputs:
      platform_tools:
        description: "Explicit disposable diagnostic only; does not change the app test gate"
        type: choice
        options: [sdk-default, "36.0.2"]
        default: sdk-default
  pull_request:
    paths:
      - ".github/workflows/android-transport-probe.yml"
      - "scripts/diagnostics/adb-transfer-*.mjs"
      - "scripts/diagnostics/run-adb-transfer-probe.mjs"
      - "scripts/diagnostics/transfer-toolchain.mjs"
      - "tests/diagnostic-toolchain.test.mjs"
      - "scripts/qa/adb-host-health.mjs"
      - "scripts/qa/adb-host-sockets.mjs"
      - "scripts/qa/adb-daemon-events.mjs"
      - "scripts/qa/emulator-host-observation.mjs"
      - "tests/adb-host-health.test.mjs"
      - "docs/release/evidence/generated-transfer-failure-063efab-2026-10-28/**"
      - "tests/adb-transfer-probe.test.mjs"
      - "tests/adb-transfer-guest.test.mjs"
      - "tests/adb-transfer-emulator.test.mjs"

permissions:
  contents: read

jobs:
  generated-file-transfer:
    name: Generated-file transport (not release)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked diagnostic test dependencies
        run: npm ci
      - name: Test diagnostic boundaries without a device
        run: node --test tests/adb-transfer-probe.test.mjs tests/adb-transfer-guest.test.mjs tests/adb-host-health.test.mjs tests/adb-transfer-emulator.test.mjs
      - name: Test explicit diagnostic toolchain selection
        run: node --test tests/diagnostic-toolchain.test.mjs
      - uses: android-actions/setup-android@v4
      - name: Enable disposable virtual-device acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run fixed primary transfers without app accounts or provider requests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SGM_LOCAL_DISPOSABLE_EMULATOR: "true"
          ADB_TRACE: transport
          SGM_TRANSFER_TOOLCHAIN: ${{ inputs.platform_tools || 'sdk-default' }}
          SGM_TRANSFER_TOOLCHAIN_RECEIPT: ${{ runner.temp }}/sgm-transfer-toolchain-selection.json
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          pre-emulator-launch-script: node scripts/diagnostics/transfer-toolchain.mjs "$SGM_TRANSFER_TOOLCHAIN"
          script: node scripts/diagnostics/run-adb-transfer-probe.mjs
      - name: Retain only sanitized command outcomes and trace counts
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-generated-transfer-diagnostic
          path: android/app/build/outputs/transport-probe/*.json
          if-no-files-found: error
