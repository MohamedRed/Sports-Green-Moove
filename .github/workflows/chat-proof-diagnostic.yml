name: Chat Proof Diagnostic

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/chat-proof-diagnostic.yml"
      - "scripts/diagnostics/ci-proof-resources.mjs"
      - "scripts/diagnostics/chat-proof-media-probe.mjs"
      - "scripts/diagnostics/run-chat-proof-diagnostic.mjs"
      - "tests/chat-proof-diagnostic.test.mjs"
      - "tests/helpers/exact-rgb-frames.mjs"
      - "tests/chat-receipt-loss*.test.mjs"

permissions:
  contents: read

jobs:
  proof:
    name: Isolated chat proof (not primary smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: npm ci
      - name: Check observer boundaries without starting any service
        run: node --test tests/chat-proof-diagnostic.test.mjs
      - name: Install matching media inspection tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Compare original pixels, then run unchanged three-file tests
        env:
          SGM_CHAT_PROOF_DIAGNOSTIC_DIR: ${{ runner.temp }}/chat-proof-diagnostic
        run: node scripts/diagnostics/run-chat-proof-diagnostic.mjs
      - name: Retain allowlisted resource observations and exact command outcomes
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: chat-proof-diagnostic
          path: |
            ${{ runner.temp }}/chat-proof-diagnostic/resources.jsonl
            ${{ runner.temp }}/chat-proof-diagnostic/result.json
          if-no-files-found: error
