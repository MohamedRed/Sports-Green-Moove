env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Functions, admin, and website smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate required checks and report ordering
        run: npm run test:pr-user-flow-checks

      - name: Test Functions
        run: npm test --workspace functions

      - name: Test Belgian trip dates across server timezones
        run: |
          for timezone in UTC America/Los_Angeles Asia/Tokyo; do
            TZ="$timezone" npm test --workspace functions -- src/__tests__/client-trip-dates.test.ts
          done

      - name: Validate Belgian trip date regression evidence
        run: node --test tests/trip-date-evidence.test.mjs

      - name: Validate scoped trip history evidence
        run: node --test tests/trip-history-evidence.test.mjs tests/local-replay-33-evidence.test.mjs

      - name: Test isolated trip history access and paging
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-trip-history/results.json
        run: node scripts/qa/run-local-trip-history.mjs

      - name: Build Functions
        run: npm run build --workspace functions

      - name: Validate local test isolation
        run: npm run test:local-flow-isolation

      - name: Validate isolated private phone tunnel policy
        run: node --test tests/browserstack-isolated-tunnel.test.mjs tests/browserstack-isolated-booking-evidence.test.mjs tests/browserstack-parent-search-evidence.test.mjs

      - name: Validate explicit real-map test boundaries without provider calls
        run: node --test tests/real-maps-local.test.mjs tests/real-maps-ui.test.mjs tests/real-map-display.test.mjs tests/real-map-framing-evidence.test.mjs tests/native-draft-and-map-stage-evidence.test.mjs tests/payment-confirmation-contract.test.mjs

      - name: Validate bounded local response-loss injection
        run: node --test tests/local-chat-response-loss.test.mjs

      - name: Validate native SDK response-loss injection
        run: node --test tests/native-chat-loss.test.mjs tests/native-chat-loss-receipt.test.mjs tests/native-chat-loss-evidence.test.mjs

      - name: Test isolated multi-person flows
        run: npm run test:local-flows

      - name: Validate guardian verification contracts and retained scope
        run: node --test tests/guardian-verification-contract.test.mjs

      - name: Test isolated guardian verification authority and lifecycle
        run: npm run test:guardian-verification

      - name: Test transaction query conflict propagation
        run: node --test tests/firestore-streaming-policy.test.mjs tests/trip-contention-evidence.test.mjs

      - name: Validate booking consistency and recovery evidence
        run: node --test tests/booking-consistency-evidence.test.mjs

      - name: Validate displayed booking intent evidence
        run: node --test tests/booking-display-evidence.test.mjs

      - name: Validate booking response-loss evidence
        run: node --test tests/booking-recovery-evidence.test.mjs tests/subscription-diagnosis-evidence.test.mjs tests/booking-ui-loss.test.mjs tests/booking-search-feedback-evidence.test.mjs

      - name: Validate current default selection comparison evidence
        run: node --test tests/default-selection-evidence.test.mjs

      - name: Test booking retry identity and changed-intent races
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-booking-recovery/transport.json
        run: npm run test:booking-response-loss

      - name: Test durable Swift booking recovery
        env:
          SGM_SWIFT_BOOKING_RECOVERY_OUTPUT: ${{ runner.temp }}/sgm-booking-recovery/swift.json
        run: npm run test:booking-recovery-wire

      - name: Test server-only booking request receipts
        run: npx firebase emulators:exec --project sports-green-moove-rules-test --only firestore "npx vitest run tests/booking-request-rules.test.ts"

      - name: Test Swift booking snapshot wire contract
        env:
          SGM_SWIFT_BOOKING_OUTPUT: ${{ runner.temp }}/sgm-booking-wire/results.json
        run: |
          mkdir -p "${{ runner.temp }}/sgm-booking-wire"
          npm run test:booking-intent-wire

      - name: Test displayed terms against current booking conditions
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-booking-display/results.json
        run: npm run test:booking-display

      - name: Test controlled approval and cancellation overlap
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-trip-contention/results.json
        run: npm run test:trip-contention

      - name: Test transactional booking terms and guardian authority
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-booking-consistency/results.json
        run: npm run test:booking-consistency

      - name: Test team club ownership rules
        run: npm run test:team-ownership-rules

      - name: Test server-owned trip cancellation rules
        run: npm run test:trip-cancellation-rules

      - name: Test server-owned trip details
        run: npm run test:trip-details-rules

      - name: Test server-owned trip proposals and parent decisions
        run: npm run test:trip-change-rules

      - name: Validate native trip cancellation integration
        run: node --test tests/trip-cancellation-native.test.mjs tests/trip-change-native.test.mjs

      - name: Validate scoped native trip-change evidence
        run: node --test tests/trip-change-native-evidence.test.mjs

      - name: Validate completed native parent consent evidence
        run: node --test tests/trip-consent-completed-evidence.test.mjs

      - name: Validate dual-transport network prerequisites
        run: node --test tests/dual-transport-config.test.mjs tests/dual-transport-evidence.test.mjs tests/dual-transport-completed-evidence.test.mjs

      - name: Validate input window readiness evidence
        run: node --test tests/input-readiness-evidence.test.mjs

      - name: Validate explicit partner component evidence scope
        run: node --test tests/partner-component-scope.test.mjs

      - name: Build Admin
        run: npm run build --workspace admin

      - name: Validate membership decision state
        run: node --test tests/membership-review-controller.test.mjs

      - name: Validate public privacy route
        run: npm run test:privacy-policy-page

      - name: Validate private partner portal evidence and contracts
        run: node --test tests/partner-portal.test.mjs tests/search-criteria-evidence.test.mjs tests/reservation-evidence.test.mjs tests/trip-capacity-evidence.test.mjs tests/membership-evidence.test.mjs tests/native-membership-evidence.test.mjs tests/chat-network-evidence.test.mjs tests/cellular-request-evidence.test.mjs tests/chat-composer-intent.test.mjs tests/team-ownership-evidence.test.mjs tests/trip-cancellation-evidence.test.mjs tests/trip-details-evidence.test.mjs tests/trip-change-evidence.test.mjs tests/trip-change-application-evidence.test.mjs tests/trip-supplement-evidence.test.mjs tests/ui-collection-evidence.test.mjs tests/chat-restart-recheck-evidence.test.mjs

      - name: Validate admin plan coverage
        run: npm run test:admin-plan-coverage

      - name: Test Stripe webhook flow
        run: npm run test:stripe-webhook-flow

      - name: Test Stripe production readiness verification
        run: npm run test:stripe-production-readiness

      - name: Test live smoke cleanup
        run: npm run test:live-smoke-cleanup

      - name: Build Website
        run: npm run build --workspace website

      - name: Upload isolated trip history results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trip-history-results
          path: ${{ runner.temp }}/sgm-trip-history/**
          if-no-files-found: ignore

      - name: Upload booking retry receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: booking-recovery-results
          path: ${{ runner.temp }}/sgm-booking-recovery/**
          if-no-files-found: ignore

      - name: Upload displayed booking and wire evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: booking-display-results
          path: |
            ${{ runner.temp }}/sgm-booking-display/**
            ${{ runner.temp }}/sgm-booking-wire/**
          if-no-files-found: ignore

      - name: Upload controlled booking consistency evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: booking-consistency-results
          path: ${{ runner.temp }}/sgm-booking-consistency/**
          if-no-files-found: ignore

      - name: Upload controlled transaction conflict evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trip-contention-results
          path: ${{ runner.temp }}/sgm-trip-contention/**
          if-no-files-found: ignore
