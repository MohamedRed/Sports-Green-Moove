        run: npm run test:child-emergency && node --test tests/child-emergency-contract.test.mjs tests/child-account-approval-contract.test.mjs tests/child-account-phone-checkpoints.test.mjs
      - name: Test immutable child contact identity and independently verified fixtures
        run: npm run test:emergency-contact-identity && npm run test:emergency-contact-fixture && npm run test:ride-emergency-fixture && node --test tests/emergency-contact-identity.test.mjs tests/manual-emergency-checkpoints.test.mjs tests/ride-emergency-evidence.test.mjs tests/ride-location-ownership.test.mjs tests/ride-emergency-completed-evidence.test.mjs

      - name: Test child contact discovery through verified-parent approval
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/child-contact-discovery.json
        run: npm run test:child-account-approval && node --test tests/child-contact-discovery.test.mjs
      - name: Test parent-shared child invitations without adult-role signup
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/child-invitation.json
        run: npm run test:child-invitation && node --test tests/child-invitation-contract.test.mjs

      - name: Test authoritative team enrollment without granting conversation access
        run: npm run test:team-enrollment && node --test tests/team-enrollment-contract.test.mjs tests/emergency-contact-completed-evidence.test.mjs

      - name: Test team enrollment across club recreation with verified disposal
        id: team_club_identity
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-team-club-identity/results.json
        run: npm run test:team-club-identity && node --test tests/team-club-identity.test.mjs

      - name: Validate recreated child contact UI evidence contract
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/emergency-identity-fixture.json
        run: node scripts/qa/run-emergency-identity-fixture.mjs && node --test tests/emergency-identity-ui.test.mjs tests/emergency-identity-profile-isolation.test.mjs

      - name: Verify observation freshness through isolated authenticated location calls
        run: npm run test:location-freshness && node --test tests/location-freshness-evidence.test.mjs

      - name: Verify atomic observation ordering through concurrent location calls
        run: npm run test:location-order && node --test tests/location-order-evidence.test.mjs

      - name: Verify selected ride observer authorization and remote lifecycle responses
        run: npm run test:ride-observation-services && node --test tests/ride-observation-contract.test.mjs tests/ride-observation-evidence.test.mjs tests/disposable-local-app-reset.test.mjs
      - name: Upload club identity trial and disposal evidence
        if: always() && steps.team_club_identity.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: team-club-identity-results
          path: ${{ runner.temp }}/sgm-team-club-identity/**
          if-no-files-found: error

      - name: Retain ledger summary and disposal results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledger-history-services
          path: ${{ runner.temp }}/ledger-history-services.json
          if-no-files-found: ignore


      - name: Retain child contact discovery and disposal evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: child-contact-discovery-results
          path: ${{ runner.temp }}/child-contact-discovery.json*
          if-no-files-found: error
      - name: Retain child invitation results and disposal
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: child-invitation-results
          path: ${{ runner.temp }}/child-invitation.json*
          if-no-files-found: error

  integration-gate:
    name: Functions, admin, and website smoke
    if: ${{ always() }}
    needs: [smoke, people-safety]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require both complete smoke groups
        env:
          SMOKE_RESULT: ${{ needs.smoke.result }}
          PEOPLE_RESULT: ${{ needs.people-safety.result }}
        run: test "$SMOKE_RESULT" = success && test "$PEOPLE_RESULT" = success
