  people-safety:
    name: People and safety service smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Build Functions
        run: npm run build --workspace functions

      - name: Install media inspection tools
        timeout-minutes: 5
        run: node --test tests/ci-media-tools.test.mjs && node scripts/ci/install-media-tools.mjs

