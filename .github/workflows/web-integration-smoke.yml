name: Web Integration Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/web-integration-smoke.yml"
      - "admin/**"
      - "docs/contracts/**"
      - "functions/**"
      - "website/**"
      - "partner-portal/**"
      - "docs/release/evidence/**"
      - "scripts/build-partner-portal.mjs"
      - "tests/partner-portal.test.mjs"
      - "tests/partner-portal.browser.mjs"
      - "scripts/qa/**"
      - "tests/local-emulator-config.test.mjs"
      - "tests/local-ui-config.test.mjs"
      - "tests/local-egress-guard.test.mjs"
      - "tests/chat-index-command.test.mjs"
      - "scripts/prepare-chat-inbox.mjs"
      - "scripts/lib/chat-index-command.mjs"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/admin-plan-coverage.test.mjs"
      - "tests/stripe-webhook-flow.test.ts"
      - "tests/stripe-production-readiness.test.mjs"
      - "scripts/check-stripe-production-readiness.mjs"
      - "scripts/lib/stripe-production-readiness.mjs"
      - "scripts/lib/stripe-readiness-http.mjs"
      - "scripts/lib/live-smoke-cleanup.mjs"
      - "scripts/live-backend-flow-smoke.mjs"
      - "tests/live-smoke-cleanup.test.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/web-integration-smoke.yml"
      - "admin/**"
      - "docs/contracts/**"
      - "functions/**"
      - "website/**"
      - "partner-portal/**"
      - "docs/release/evidence/**"
      - "scripts/build-partner-portal.mjs"
      - "tests/partner-portal.test.mjs"
      - "tests/partner-portal.browser.mjs"
      - "scripts/qa/**"
      - "tests/local-emulator-config.test.mjs"
      - "tests/local-ui-config.test.mjs"
      - "tests/local-egress-guard.test.mjs"
      - "tests/chat-index-command.test.mjs"
      - "scripts/prepare-chat-inbox.mjs"
      - "scripts/lib/chat-index-command.mjs"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/admin-plan-coverage.test.mjs"
      - "tests/stripe-webhook-flow.test.ts"
      - "tests/stripe-production-readiness.test.mjs"
      - "scripts/check-stripe-production-readiness.mjs"
      - "scripts/lib/stripe-production-readiness.mjs"
      - "scripts/lib/stripe-readiness-http.mjs"
      - "scripts/lib/live-smoke-cleanup.mjs"
      - "scripts/live-backend-flow-smoke.mjs"
      - "tests/live-smoke-cleanup.test.mjs"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Functions, admin, and website smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test Functions
        run: npm test --workspace functions

      - name: Build Functions
        run: npm run build --workspace functions

      - name: Validate local test isolation
        run: npm run test:local-flow-isolation

      - name: Test isolated multi-person flows
        run: npm run test:local-flows

      - name: Build Admin
        run: npm run build --workspace admin

      - name: Validate public privacy route
        run: npm run test:privacy-policy-page

      - name: Validate private partner portal evidence and contracts
        run: node --test tests/partner-portal.test.mjs

      - name: Validate admin plan coverage
        run: npm run test:admin-plan-coverage

      - name: Test Stripe webhook flow
        run: npm run test:stripe-webhook-flow

      - name: Test Stripe production readiness verification
        run: npm run test:stripe-production-readiness

      - name: Test live smoke cleanup
        run: npm run test:live-smoke-cleanup

      - name: Build Website
        run: npm run build --workspace website
