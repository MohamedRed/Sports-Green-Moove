env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Functions, admin, and website checks
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate required checks and report ordering
        run: npm run test:pr-user-flow-checks
      - name: Validate complete smoke partitioning
        run: node --test tests/web-smoke-sharding.test.mjs

      - name: Test primary capture observation protocol
        run: node --test tests/primary-capture-diagnostics.test.mjs

      - name: Test Functions
        run: npm test --workspace functions
      - name: Validate bounded collection regression evidence
        run: node --test tests/bounded-validation-evidence.test.mjs

      - name: Test Belgian trip dates across server timezones
        run: |
          for timezone in UTC America/Los_Angeles Asia/Tokyo; do
            TZ="$timezone" npm test --workspace functions -- src/__tests__/client-trip-dates.test.ts
          done

      - name: Validate Belgian trip date regression evidence
        run: node --test tests/trip-date-evidence.test.mjs

      - name: Validate scoped trip history evidence
        run: node --test tests/trip-history-evidence.test.mjs tests/local-replay-33-evidence.test.mjs tests/local-replay-34-evidence.test.mjs

      - name: Test isolated trip history access and paging
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/sgm-trip-history/results.json
        run: node scripts/qa/run-local-trip-history.mjs

      - name: Build Functions
        run: npm run build --workspace functions

      - name: Validate local test isolation
        run: npm run test:local-flow-isolation
      - name: Validate independent focused safety lane
        run: node --test tests/native-focused-runner.test.mjs tests/continuous-disposable-device.test.mjs tests/emulator-host-observation.test.mjs tests/disposable-launcher-cleanup.test.mjs
      - name: Validate preinstalled full-matrix APKs and complete raw JUnit inventory
        run: node --test tests/android-junit-transcript.test.mjs tests/android-matrix-preparation.test.mjs tests/manual-trip-components.test.mjs
      - name: Validate retained independent Android execution and device observations
        run: node --test tests/independent-native-evidence.test.mjs tests/continuous-device-evidence.test.mjs
      - name: Test bounded restoration faults and unchanged fixture records
        run: node --test tests/session-transport-observations.test.mjs tests/session-restoration-fault-proxy.test.mjs tests/session-restoration-records.test.mjs tests/session-restoration-retained-evidence.test.mjs tests/session-restoration-recheck.test.mjs tests/session-restoration-recovery.test.mjs tests/ride-observation-preparation.test.mjs tests/session-disconnect.test.mjs tests/session-disconnect-retained-evidence.test.mjs
      - name: Validate guarded full-search preparation and accessible trip controls
        run: node --test tests/parent-search-booking-preparation.test.mjs tests/search-maps-budget.test.mjs tests/search-booking-runner.test.mjs tests/search-maps-bridge.test.mjs tests/search-booking-retained-evidence.test.mjs
      - name: Replay current search booking notice contract without map requests
        env:
          SGM_LOCAL_FLOW_OUTPUT: ${{ runner.temp }}/search-booking-notice-services.json
        run: node scripts/qa/run-search-booking-notice-services.mjs
      - name: Validate retained physical search and booking proof without provider calls
        run: node --test tests/search-booking-phone.test.mjs
