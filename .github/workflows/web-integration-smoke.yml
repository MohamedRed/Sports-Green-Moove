env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    name: Functions, admin, and website smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Validate required checks and report ordering
        run: npm run test:pr-user-flow-checks

      - name: Test Functions
        run: npm test --workspace functions

      - name: Test Belgian trip dates across server timezones
        run: |
          for timezone in UTC America/Los_Angeles Asia/Tokyo; do
            TZ="$timezone" npm test --workspace functions -- src/__tests__/client-trip-dates.test.ts
          done

      - name: Validate Belgian trip date regression evidence
        run: node --test tests/trip-date-evidence.test.mjs

      - name: Validate scoped trip history evidence
