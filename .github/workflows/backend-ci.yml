name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "admin/**"
      - "functions/**"
      - "scripts/qa/**"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "admin/**"
      - "functions/**"
      - "scripts/qa/**"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  functions-and-rules:
    name: Functions and Firebase rules
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test runtime proxy trust against forwarded-address spoofing
        run: node --test tests/proxy-trust-security.test.mjs

      - name: Validate network run evidence and temporary administration cleanup
        run: node --test tests/native-network-precondition-evidence.test.mjs tests/native-matrix-36-evidence.test.mjs

      - name: Validate initial network observation before test-only transport requests
        run: node --test tests/network-start-observation.test.mjs

      - name: Test functions
        run: npm run test --workspace functions

      - name: Build functions
        run: npm run build --workspace functions

      - name: Build admin console
        run: npm run build --workspace admin

      - name: Test Firebase rules
        run: npm run test:rules

      - name: Test Stripe webhook flow
        run: npm run test:stripe-webhook-flow

      - name: Test isolated payment confirmation access and read-only status
        run: node scripts/qa/run-local-payment-status.mjs

      - name: Test isolated guardian verification authority and lifecycle
        run: npm run test:guardian-verification

      - name: Test guardian review permissions, pagination and decision state
        run: npm run test:guardian-review && node --test tests/guardian-review-controller.test.mjs tests/guardian-review-evidence.test.mjs

      - name: Test parent verification choices and authoritative state reads
        run: npm run test:guardian-parent && node --test tests/guardian-parent-contract.test.mjs

      - name: Test private emergency contact ownership and revocation
        run: npm run test:emergency-contact && node --test tests/emergency-contact-contract.test.mjs tests/emergency-contact-editor-contract.test.mjs tests/emergency-contact-native.test.mjs tests/emergency-contact-scheduler.test.mjs

      - name: Test authoritative team enrollment without granting conversation access
        run: npm run test:team-enrollment && node --test tests/team-enrollment-contract.test.mjs tests/emergency-contact-completed-evidence.test.mjs

      - name: Test scoped team and verified child choices
        run: npm run test:team-options && node --test tests/team-enrollment-native-contract.test.mjs

      - name: Test shared membership cursor continuation and authorization
        run: npm run test:membership-cursors && node --test tests/membership-cursor-contract.test.mjs

      - name: Test native team fixture lifecycle and fail-closed evidence contract
        run: npm run test:team-native-fixtures && node --test tests/team-enrollment-sdk.test.mjs tests/team-phone-evidence.test.mjs

      - name: Test manager team review scope and real service lifecycle
        run: npm run test:team-review && node --test tests/team-review-controller.test.mjs tests/team-review-wire.test.mjs tests/team-review-evidence.test.mjs
