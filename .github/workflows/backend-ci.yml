name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "admin/**"
      - "functions/**"
      - "scripts/qa/**"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "admin/**"
      - "functions/**"
      - "scripts/qa/**"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  functions-and-rules:
    name: Functions and Firebase rules
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test functions
        run: npm run test --workspace functions

      - name: Build functions
        run: npm run build --workspace functions

      - name: Build admin console
        run: npm run build --workspace admin

      - name: Test Firebase rules
        run: npm run test:rules

      - name: Test Stripe webhook flow
        run: npm run test:stripe-webhook-flow

      - name: Test isolated payment confirmation access and read-only status
        run: node scripts/qa/run-local-payment-status.mjs

      - name: Test isolated guardian verification authority and lifecycle
        run: npm run test:guardian-verification

      - name: Test guardian review permissions, pagination and decision state
        run: npm run test:guardian-review && node --test tests/guardian-review-controller.test.mjs tests/guardian-review-evidence.test.mjs

      - name: Test parent verification choices and authoritative state reads
        run: npm run test:guardian-parent && node --test tests/guardian-parent-contract.test.mjs

      - name: Test private emergency contact ownership and revocation
        run: npm run test:emergency-contact && node --test tests/emergency-contact-contract.test.mjs tests/emergency-contact-editor-contract.test.mjs tests/emergency-contact-native.test.mjs
