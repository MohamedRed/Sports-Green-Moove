name: Backend CI

on:
  pull_request:
    paths:
      - ".github/workflows/backend-ci.yml"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "functions/**"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - "database.rules.json"
      - "firebase.json"
      - "firestore.indexes.json"
      - "firestore.rules"
      - "functions/**"
      - "package-lock.json"
      - "package.json"
      - "storage.rules"
      - "tests/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  functions-and-rules:
    name: Functions and Firebase rules
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Test functions
        run: npm run test --workspace functions

      - name: Build functions
        run: npm run build --workspace functions

      - name: Test Firebase rules
        run: npm run test:rules
