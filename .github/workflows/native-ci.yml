name: Native CI

on:
  workflow_dispatch:
    inputs:
      real_maps_ui:
        description: "Run the approved isolated real-map UI integration (five server requests)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "tests/native-build-before-boot.test.mjs"
      - "tests/adb-host-health.test.mjs"
      - "tests/team-enrollment-sdk.test.mjs"
      - "tests/membership-cursor-contract.test.mjs"
      - "tests/team-enrollment-native-contract.test.mjs"
      - ".github/workflows/native-ci.yml"
      - ".github/workflows/native-real-maps-ui.yml"
      - ".github/actions/native-test-setup/**"
      - "scripts/run-real-maps-android-ui.sh"
      - "tests/real-map*.test.mjs"
      - "android/**"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/qa/**"
      - "scripts/run-android-ui-tests-and-collect-screenshots.sh"
      - "tests/local-ui-config.test.mjs"
      - "tests/emergency-contact-native.test.mjs"
      - "tests/emergency-contact-scheduler.test.mjs"
      - "tests/local-evidence-collection.test.mjs"
      - "tests/conversation-test-input.test.mjs"
      - "tests/trip-change-ui.test.mjs"
      - "tests/trip-change-inputs-ui.test.mjs"
      - "tests/trip-change-schedule-ui.test.mjs"
      - "tests/trip-schedule-completed-evidence.test.mjs"
      - "tests/trip-consent-restart.test.mjs"
      - "tests/trip-draft-restart.test.mjs"
      - "tests/trip-consent-recovery.test.mjs"
      - "tests/trip-consent-recovery-completed-evidence.test.mjs"
      - "tests/trip-consent-restart-completed-evidence.test.mjs"
      - "tests/native-suite-runner.test.mjs"
      - "tests/*failure*.test.mjs"
      - "tests/local-http-request.test.mjs"
      - "tests/fixtures/local-idle-http-server.mjs"
      - "tests/fixtures/adb-evidence-process.mjs"
      - "tests/disposable-android.test.mjs"
      - "tests/disposable-store-pause.test.mjs"
      - "tests/disposable-installations.test.mjs"
      - "tests/disposable-install-admin.test.mjs"
      - "tests/native-membership-config.test.mjs"
      - "tests/chat-network-config.test.mjs"
      - "tests/dual-transport-config.test.mjs"
      - "tests/network-start-observation.test.mjs"
      - "tests/local-modem-diagnostics.test.mjs"
      - "tests/local-default-selection-diagnostics.test.mjs"
      - "tests/chat-process-restart.test.mjs"
      - "tests/session-restoration.test.mjs"
      - "scripts/check-ios-native-plan.sh"
      - "tests/native-ui-coverage.test.mjs"
  push:
    branches:
      - main
    paths:
      - "tests/native-build-before-boot.test.mjs"
      - "tests/adb-host-health.test.mjs"
      - "tests/team-enrollment-sdk.test.mjs"
      - "tests/membership-cursor-contract.test.mjs"
      - "tests/team-enrollment-native-contract.test.mjs"
      - ".github/workflows/native-ci.yml"
      - ".github/workflows/native-real-maps-ui.yml"
      - ".github/actions/native-test-setup/**"
      - "scripts/run-real-maps-android-ui.sh"
      - "tests/real-map*.test.mjs"
      - "android/**"
      - "ios/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/qa/**"
      - "scripts/run-android-ui-tests-and-collect-screenshots.sh"
      - "tests/local-ui-config.test.mjs"
      - "tests/emergency-contact-native.test.mjs"
      - "tests/emergency-contact-scheduler.test.mjs"
      - "tests/local-evidence-collection.test.mjs"
      - "tests/conversation-test-input.test.mjs"
      - "tests/trip-change-ui.test.mjs"
      - "tests/trip-change-inputs-ui.test.mjs"
      - "tests/trip-change-schedule-ui.test.mjs"
      - "tests/trip-schedule-completed-evidence.test.mjs"
      - "tests/trip-consent-restart.test.mjs"
      - "tests/trip-draft-restart.test.mjs"
      - "tests/trip-consent-recovery.test.mjs"
      - "tests/trip-consent-recovery-completed-evidence.test.mjs"
      - "tests/trip-consent-restart-completed-evidence.test.mjs"
      - "tests/native-suite-runner.test.mjs"
      - "tests/*failure*.test.mjs"
      - "tests/local-http-request.test.mjs"
      - "tests/fixtures/local-idle-http-server.mjs"
      - "tests/fixtures/adb-evidence-process.mjs"
      - "tests/disposable-android.test.mjs"
      - "tests/disposable-store-pause.test.mjs"
      - "tests/disposable-installations.test.mjs"
      - "tests/disposable-install-admin.test.mjs"
      - "tests/native-membership-config.test.mjs"
      - "tests/chat-network-config.test.mjs"
      - "tests/dual-transport-config.test.mjs"
      - "tests/network-start-observation.test.mjs"
      - "tests/local-modem-diagnostics.test.mjs"
      - "tests/local-default-selection-diagnostics.test.mjs"
      - "tests/chat-process-restart.test.mjs"
      - "tests/session-restoration.test.mjs"
      - "scripts/check-ios-native-plan.sh"
      - "tests/native-ui-coverage.test.mjs"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  native-ui-coverage:
    name: Native UI flow coverage
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up native configuration tests
        uses: ./.github/actions/native-test-setup

      - name: Validate team enrollment unit and compiled-screen scope
        run: node --test tests/team-enrollment-native-contract.test.mjs

      - name: Validate SDK-connected team replay evidence requirements
        run: node --test tests/team-enrollment-sdk.test.mjs

      - name: Validate sanitized host transport observations
        run: node --test tests/adb-host-health.test.mjs tests/native-build-before-boot.test.mjs

      - name: Validate membership cursor regression and client decoder evidence
        run: node --test tests/membership-cursor-contract.test.mjs

      - name: Validate disposable Android isolation
        run: node --test tests/disposable-installations.test.mjs tests/disposable-install-admin.test.mjs tests/disposable-android.test.mjs tests/disposable-store-pause.test.mjs tests/native-membership-config.test.mjs tests/chat-network-config.test.mjs tests/local-modem-diagnostics.test.mjs tests/local-default-selection-diagnostics.test.mjs tests/chat-process-restart.test.mjs tests/local-evidence-collection.test.mjs tests/conversation-test-input.test.mjs tests/session-restoration.test.mjs tests/adb-sync-failure-diagnostics.test.mjs tests/guardian-parent-contract.test.mjs tests/emergency-contact-native.test.mjs tests/emergency-contact-scheduler.test.mjs

      - name: Validate dual-transport network prerequisites
        run: node --test tests/dual-transport-config.test.mjs tests/trip-change-ui.test.mjs tests/trip-change-inputs-ui.test.mjs tests/trip-change-schedule-ui.test.mjs tests/trip-schedule-completed-evidence.test.mjs tests/trip-consent-restart.test.mjs tests/trip-draft-restart.test.mjs tests/trip-consent-recovery.test.mjs tests/trip-consent-recovery-completed-evidence.test.mjs tests/trip-consent-restart-completed-evidence.test.mjs tests/native-suite-runner.test.mjs tests/native-process-failure-evidence.test.mjs tests/local-http-request.test.mjs

      - name: Validate real-map UI isolation without provider calls
        run: node --test tests/real-maps-ui.test.mjs tests/real-map-display.test.mjs

      - name: Validate initial network observation before test-only transport requests
        run: node --test tests/network-start-observation.test.mjs

  android-native-unit:
    name: Android native unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Run Android native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

  android-native-ui:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.real_maps_ui && 'Offline UI matrix (not requested)' || 'Android native UI tests' }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.real_maps_ui }}
    runs-on: ubuntu-latest
    timeout-minutes: 35

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node for isolated app flows
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install isolated test dependencies
        run: npm ci

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Compile app and tests before starting the disposable device
        env:
          SGM_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.SGM_GOOGLE_MAPS_ANDROID_API_KEY }}
        run: ./android/gradlew -p android :app:assembleDebug :app:assembleDebugAndroidTest :qa-install-guard:assembleDebug --no-daemon --stacktrace

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SGM_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.SGM_GOOGLE_MAPS_ANDROID_API_KEY }}
          SGM_LOCAL_DISPOSABLE_EMULATOR: "true"
          SGM_PAUSE_TEST_PHONE_STORE: "true"
          SGM_BLOCK_TEST_PHONE_INSTALLS: "true"
          SGM_TEST_PHONE_ADMIN_APPROVED: "true"
        with:
          api-level: 35
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_6
          script: bash scripts/run-android-ui-tests-and-collect-screenshots.sh

      - name: Upload Android instrumentation reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: android-connected-ui-test-results
          path: |
            android/app/build/reports/androidTests/connected/**
            android/app/build/outputs/androidTest-results/connected/**
            android/app/build/outputs/store-review-screenshots/**
            android/app/build/outputs/local-ui-evidence/**
          if-no-files-found: ignore

  android-real-maps-ui:
    name: Android approved real-map UI integration
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.real_maps_ui }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-real-maps-ui.yml
    secrets:
      GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
      SGM_GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.SGM_GOOGLE_MAPS_ANDROID_API_KEY }}

  ios-native-checks:
    name: iOS native checks
    # macOS runners are intentionally disabled for routine CI cost control.
    # Re-enable only for an approved final iOS release-candidate build.
    if: ${{ false }}
    runs-on: macos-26-intel

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          for xcode in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode.app
          do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Run iOS native plan checks
        run: bash scripts/check-ios-native-plan.sh

      - name: Build Swift package scaffold
        run: swift build --package-path ios

  ios-native-ui:
    name: iOS native UI tests
    # macOS runners are intentionally disabled for routine CI cost control.
    # Re-enable only for an approved final iOS release-candidate build.
    if: ${{ false }}
    runs-on: macos-26-intel

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: |
          for xcode in \
            /Applications/Xcode_26.5.app \
            /Applications/Xcode_26.4.1.app \
            /Applications/Xcode_26.3.app \
            /Applications/Xcode_26.2.app \
            /Applications/Xcode.app
          do
            if [ -d "$xcode" ]; then
              sudo xcode-select -s "$xcode"
              break
            fi
          done
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate --spec project.yml

      - name: Run iOS simulator UI tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project SportsGreenMoove.xcodeproj \
            -scheme SportsGreenMoove \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build/UITestDerivedData \
            CODE_SIGNING_ALLOWED=NO
