name: Native CI

on:
  workflow_dispatch:
    inputs:
      full_matrix_renderer:
        description: "Full-matrix renderer; swiftshader is a diagnostic comparison, not a release check"
        type: choice
        options: [software, swiftshader]
        default: software
      real_maps_ui:
        description: "Run the approved isolated real-map UI integration (five server requests)"
        type: boolean
        default: false
      vehicle_map_ui:
        description: "Run the approved isolated vehicle-marker display test (SDK tiles only)"
        type: boolean
        default: false
      parent_search_booking:
        description: "Use the one approved isolated search/booking trial, maximum eight server map requests"
